name: Reja Kanvas

on:
  push:
    branches: [claude/eloquent-archimedes-wfukgo]
    paths:
      - "reja-kanvas/**"
      - ".github/workflows/reja-kanvas.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reja-kanvas/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reja-kanvas/frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: pip install -r ../backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            reja-kanvas/frontend/playwright-report
            reja-kanvas/frontend/test-results
          retention-days: 7
